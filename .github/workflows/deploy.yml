name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: 20
  APP_NAME: dailyhelp
  RELEASE_ARCHIVE: dailyhelp-release.tar.gz

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - run: npm run build

      - name: Package release artifact
        run: |
          tar --owner=0 --group=0 --mode='go-w' -czf "${RELEASE_ARCHIVE}" \
            .next public package.json package-lock.json ecosystem.config.js

      - uses: actions/upload-artifact@v4
        with:
          name: dailyhelp-release
          path: ${{ env.RELEASE_ARCHIVE }}
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dailyhelp-release
          path: .

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "SSH_HOST=$SSH_HOST" >> $GITHUB_ENV
          ssh-keyscan -t ed25519 "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy via wrapper
        env:
          SSH_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          RELEASE="release-$(date +%s)-${{ github.run_number }}-${{ github.sha }}"
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            "deploy $APP_NAME $RELEASE $DEPLOY_PATH" < "${RELEASE_ARCHIVE}"

      - name: Tear down SSH
        if: always()
        run: rm -f ~/.ssh/deploy_key
