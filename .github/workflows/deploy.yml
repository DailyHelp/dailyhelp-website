name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: 20
  APP_DIR: /var/www/dailyhelp
  APP_NAME: dailyhelp
  ARCHIVE_NAME: dailyhelp-${{ github.sha }}.tgz
  RELEASE_NAME: release-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Create deploy bundle
        run: |
          git archive --format=tar HEAD | gzip > "${ARCHIVE_NAME}"

      - name: Upload bundle to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          source: "${{ env.ARCHIVE_NAME }}"
          target: "/tmp"

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -euo pipefail

            APP_DIR="${{ env.APP_DIR }}"
            RELEASES_DIR="${APP_DIR}/releases"
            SHARED_DIR="${APP_DIR}/shared"
            RELEASE="${RELEASES_DIR}/${{ env.RELEASE_NAME }}"
            ARCHIVE="/tmp/${{ env.ARCHIVE_NAME }}"

            mkdir -p "${RELEASES_DIR}" "${SHARED_DIR}"
            mkdir -p "${RELEASE}"

            tar xzf "${ARCHIVE}" -C "${RELEASE}"
            rm -f "${ARCHIVE}"

            if [ -f "${SHARED_DIR}/.env" ]; then
              ln -sfn "${SHARED_DIR}/.env" "${RELEASE}/.env"
            fi

            cd "${RELEASE}"
            export npm_config_production=false
            npm ci --include=dev
            npm run build

            ln -sfn "${RELEASE}" "${APP_DIR}/current"

            cd "${APP_DIR}/current"
            pm2 startOrReload ecosystem.config.js --env production
            pm2 save --force

            CURRENT="$(readlink -f "${APP_DIR}/current" || true)"
            find "${RELEASES_DIR}" -maxdepth 1 -mindepth 1 -type d -printf '%T@ %p\n' \
              | sort -n \
              | head -n -3 \
              | awk '{ $1=""; sub(/^ /,""); print }' \
              | while read -r dir; do
                  [ "${dir}" = "${CURRENT}" ] && continue
                  rm -rf "${dir}"
                done
